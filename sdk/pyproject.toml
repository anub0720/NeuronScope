[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronscope"
version = "0.1.0"
description = "PyTorch SDK for live NeuronScope model monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "keyring>=25.6",
    "numpy>=1.23",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuronscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
